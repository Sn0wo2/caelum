name: Native

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Acta release tag to fetch, or latest
        default: latest
        required: true
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Embedded Acta runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go run -mod=readonly ./cmd/demo

  refresh:
    name: Refresh embedded Acta artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch Acta release assets
        id: fetch
        env:
          ACTA_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-native.js

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(native): refresh embedded Acta artifacts"
          branch: automation/native-refresh
          delete-branch: true
          title: "chore(native): refresh embedded Acta artifacts"
          body: |
            Refresh the embedded native assets from Acta release [${{ steps.fetch.outputs.tag }}](${{ steps.fetch.outputs.url }}).
          add-paths: |
            internal/native/version.go
            internal/native/windows_amd64/acta_ffi.dll
            internal/native/windows_arm64/acta_ffi.dll
            internal/native/linux_amd64/libacta_ffi.so
            internal/native/linux_arm64/libacta_ffi.so
            internal/native/darwin_amd64/libacta_ffi.dylib
            internal/native/darwin_arm64/libacta_ffi.dylib
