name: Refresh native artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Acta release tag to fetch, or latest
        default: latest
        required: true
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: native-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch Acta release assets
        id: fetch
        env:
          ACTA_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          if [[ $ACTA_TAG == latest ]]; then
            gh api repos/Sn0wo2/acta/releases/latest > release.json
          else
            gh api "repos/Sn0wo2/acta/releases/tags/$ACTA_TAG" > release.json
          fi

          tag=$(jq -r .tag_name release.json)
          url=$(jq -r .html_url release.json)
          if [[ $ACTA_TAG == latest && $(jq '(.draft or .prerelease)' release.json) == true ]]; then
            echo "::error::Acta release $tag is not an eligible stable release"
            exit 1
          fi

          version=${tag#v}
          archives=(acta_${version}_ffi_linux-windows.tar.gz acta_${version}_ffi_macos.tar.gz)
          linux_archive=${archives[0]}
          macos_archive=${archives[1]}

          available=$(jq -r '[.assets[].name] | join(", ")' release.json)
          for archive in "${archives[@]}"; do
            if ! jq -e --arg archive "$archive" 'any(.assets[]; .name == $archive)' release.json >/dev/null; then
              echo "::error::Acta release $tag is missing required FFI archive $archive. Available assets: ${available:-none}. No native files were changed."
              exit 1
            fi
          done

          declare -A digests=()
          without_digest=()
          for archive in "${archives[@]}"; do
            digest=$(jq -r --arg archive "$archive" '.assets[] | select(.name == $archive) | .digest // ""' release.json)
            if [[ $digest =~ ^sha256:([a-f0-9]{64})$ ]]; then
              digests[$archive]=${BASH_REMATCH[1]}
            else
              without_digest+=("$archive")
            fi
          done

          if (( ${#without_digest[@]} > 0 )); then
            checksums_url=$(jq -r '.assets[] | select(.name == "checksums.txt") | .browser_download_url' release.json)
            if [[ -z $checksums_url ]]; then
              echo "::error::Acta release $tag has no SHA256 digest for every FFI archive and no checksums.txt. No native files were changed."
              exit 1
            fi
            gh api "$checksums_url" > checksums.txt
            for archive in "${without_digest[@]}"; do
              digest=$(awk -v archive="$archive" '$2 == archive || $2 == "*" archive { print $1; exit }' checksums.txt)
              if [[ ! $digest =~ ^[a-f0-9]{64}$ ]]; then
                echo "::error::Acta checksums.txt has no SHA256 digest for $archive. No native files were changed."
                exit 1
              fi
              digests[$archive]=$digest
            done
          fi

          for archive in "${archives[@]}"; do
            asset_url=$(jq -r --arg archive "$archive" '.assets[] | select(.name == $archive) | .browser_download_url' release.json)
            gh api "$asset_url" > "$archive"
            echo "${digests[$archive]}  $archive" | sha256sum --check --status || {
              echo "::error::SHA256 mismatch for Acta archive $archive"
              exit 1
            }
          done

          staged="$RUNNER_TEMP/staged"
          mapping=(
            "$linux_archive"$'\t'"x86_64-unknown-linux-gnu/libacta_ffi.so"$'\t'"linux_amd64/libacta_ffi.so"
            "$linux_archive"$'\t'"aarch64-unknown-linux-gnu/libacta_ffi.so"$'\t'"linux_arm64/libacta_ffi.so"
            "$linux_archive"$'\t'"x86_64-pc-windows-gnu/acta_ffi.dll"$'\t'"windows_amd64/acta_ffi.dll"
            "$linux_archive"$'\t'"aarch64-pc-windows-gnullvm/acta_ffi.dll"$'\t'"windows_arm64/acta_ffi.dll"
            "$macos_archive"$'\t'"x86_64-apple-darwin/libacta_ffi.dylib"$'\t'"darwin_amd64/libacta_ffi.dylib"
            "$macos_archive"$'\t'"aarch64-apple-darwin/libacta_ffi.dylib"$'\t'"darwin_arm64/libacta_ffi.dylib"
          )
          for row in "${mapping[@]}"; do
            IFS=$'\t' read -r archive entry target <<< "$row"
            mkdir -p "$staged/${target%/*}"
            tar -xzOf "$archive" "$entry" > "$staged/$target" || {
              echo "::error::Required entry $entry is missing or invalid in $archive. No native files were changed."
              exit 1
            }
            if [[ ! -s "$staged/$target" ]]; then
              echo "::error::Required entry $entry is empty in $archive. No native files were changed."
              exit 1
            fi
          done

          mkdir -p "$GITHUB_WORKSPACE/internal/native"
          cp -R "$staged/." "$GITHUB_WORKSPACE/internal/native/"

          cat > "$GITHUB_WORKSPACE/internal/native/version.go" <<EOF
          // Code generated by .github/workflows/native.yml; DO NOT EDIT.

          package native

          // EmbeddedActaVersion is the acta release the embedded FFI binaries were
          // fetched from. Regenerated on native artifact refresh.
          const EmbeddedActaVersion = "$version"
          EOF

          {
            echo "tag=$tag"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Fetched six FFI assets from Acta release $tag ($url)"

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(native): refresh embedded Acta artifacts"
          branch: automation/native-refresh
          delete-branch: true
          title: "chore(native): refresh embedded Acta artifacts"
          body: |
            Refresh the embedded native assets from Acta release [${{ steps.fetch.outputs.tag }}](${{ steps.fetch.outputs.url }}).
          add-paths: |
            internal/native/version.go
            internal/native/windows_amd64/acta_ffi.dll
            internal/native/windows_arm64/acta_ffi.dll
            internal/native/linux_amd64/libacta_ffi.so
            internal/native/linux_arm64/libacta_ffi.so
            internal/native/darwin_amd64/libacta_ffi.dylib
            internal/native/darwin_arm64/libacta_ffi.dylib
